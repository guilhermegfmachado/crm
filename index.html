<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Personal outreach CRM — translation services.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>Outreach CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d11'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='20' fill='%23d4a853'%3E✉%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
  /* Set theme before first paint to avoid a flash of the wrong mode */
  (function(){
    try {
      var t = localStorage.getItem('gm_theme');
      if (t !== 'light' && t !== 'dark')
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --border: #242424;
  --border-hover: #333;
  --text: #e8e8e8;
  --muted: #666;
  --accent: #c8f542;
  --accent-dim: #a8d030;
}
:root[data-theme="light"] {
  --bg: #ffffff;
  --surface: #f5f5f6;
  --border: #e3e3e6;
  --border-hover: #cdcdd2;
  --text: #1b1b1d;
  --muted: #71717a;
  --accent: #5d8700;
  --accent-dim: #4a6c00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}

/* Header */
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.hdr-title{font-size:18px;font-weight:600;color:var(--accent);letter-spacing:-0.02em}
.hdr-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}
.hdr-right{display:flex;align-items:center;gap:20px}
.stats{display:flex;align-items:center;gap:16px}
.stat{text-align:center}
.stat-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);line-height:1}
.stat-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.stat-sep{width:1px;height:28px;background:var(--border)}
.btn-reset{font-family:'DM Mono',monospace;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:4px;cursor:pointer;transition:border-color .15s,color .15s}
.btn-reset:hover{border-color:var(--border-hover);color:var(--text)}
.btn-theme{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 8px;border-radius:4px;cursor:pointer;transition:border-color .15s,color .15s}
.btn-theme:hover{border-color:var(--border-hover);color:var(--text)}
.btn-theme svg{width:15px;height:15px;display:block}
:root[data-theme="dark"] .btn-theme .icon-moon{display:none}
:root[data-theme="light"] .btn-theme .icon-sun{display:none}

/* Controls */
.ctrl{display:flex;align-items:center;gap:6px;padding:10px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fbtn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 11px;border-radius:4px;cursor:pointer;transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:var(--border-hover);color:var(--text)}
.fbtn.act-a{color:var(--accent);border-color:var(--accent);background:rgba(200,245,66,.07)}
.fbtn.act-c{color:#3b82f6;border-color:#3b82f6;background:rgba(59,130,246,.07)}
.fbtn.act-m{color:#f59e0b;border-color:#f59e0b;background:rgba(245,158,11,.07)}
.fbtn.act-co{color:#8b5cf6;border-color:#8b5cf6;background:rgba(139,92,246,.07)}
.fbtn.act-cu{color:#ec4899;border-color:#ec4899;background:rgba(236,72,153,.07)}
.fbtn.act-h{color:#06b6d4;border-color:#06b6d4;background:rgba(6,182,212,.07)}
.fbtn.act-j{color:#10b981;border-color:#10b981;background:rgba(16,185,129,.07)}
.csep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.search{font-family:'DM Mono',monospace;font-size:12px;background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:4px;width:200px;margin-left:auto;transition:border-color .15s}
.search:focus{outline:none;border-color:var(--border-hover)}
.search::placeholder{color:var(--muted)}

/* Template panel */
.tpanel{border-bottom:1px solid var(--border);background:var(--surface)}
.ttoggle{display:flex;align-items:center;gap:8px;width:100%;padding:10px 24px;background:transparent;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;transition:color .15s;text-align:left}
.ttoggle:hover{color:var(--text)}
.tchev{margin-left:auto;transition:transform .2s}
.ttoggle.open .tchev{transform:rotate(180deg)}
.tbody2{display:none;padding:0 24px 16px}
.tbody2.open{display:block}
.ttabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
.ttab{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);padding:7px 14px;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap}
.ttab:hover{color:var(--text)}
.ttab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tcontent{}
.theater{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.tsubj{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.btn-ctpl{font-family:'DM Mono',monospace;font-size:10px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:3px;cursor:pointer;transition:all .15s;flex-shrink:0;margin-left:12px}
.btn-ctpl:hover{border-color:var(--accent-dim);color:var(--accent)}
.btn-ctpl.copied{border-color:var(--accent);color:var(--accent)}
.ttext{font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--text);white-space:pre-wrap;line-height:1.65;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px 14px;max-height:180px;overflow-y:auto}

/* Table */
.twrap{padding:0 24px 48px}
table{width:100%;border-collapse:collapse}
.gh td{padding:14px 8px 5px;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;border-top:1px solid var(--border)}
.gh.first td{border-top:none;padding-top:10px}
.er{transition:background .1s}
.er:hover{background:var(--surface)}
.er td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.er.sent{opacity:.45}
.cc{width:32px;text-align:center}
.eck{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.en{font-size:13px;font-weight:500;color:var(--text)}
.er.sent .en{text-decoration:line-through}
.es{font-size:11px;color:var(--muted);margin-top:1px}
.ce{width:260px}
.ee{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.cbadge{width:80px}
.cst{width:80px}
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.s-confirmed{background:rgba(200,245,66,.1);color:var(--accent-dim);border:1px solid rgba(200,245,66,.2)}
.s-pattern{background:rgba(102,102,102,.1);color:var(--muted);border:1px solid rgba(102,102,102,.2)}
.ccp{width:60px;text-align:right}
.btn-cr{font-family:'DM Mono',monospace;font-size:9px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:3px;cursor:pointer;transition:all .15s}
.btn-cr:hover{border-color:var(--border-hover);color:var(--text)}
.btn-cr.copied{color:var(--accent);border-color:var(--accent)}
#nores{text-align:center;padding:48px;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.sort-btn{font-family:'DM Mono',monospace;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:4px;cursor:pointer;transition:all .15s;margin-left:auto;white-space:nowrap}
.sort-btn:hover{border-color:var(--border-hover);color:var(--text)}
.sort-btn.active{border-color:var(--accent);color:var(--accent)}
.prank{display:inline-block;min-width:22px;text-align:right;font-size:10px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.warn{display:flex;align-items:flex-start;gap:10px;margin:0 0 16px;padding:11px 14px;background:rgba(232,162,58,.07);border:1px solid rgba(232,162,58,.28);border-radius:6px;font-size:12px;line-height:1.5;color:#e9c98a}
.warn svg{flex:0 0 auto;margin-top:1px;color:#e8a23a}
.warn b{color:#f0d9a8;font-weight:600}
.warn-x{margin-left:auto;flex:0 0 auto;background:transparent;border:none;color:#e9c98a;opacity:.6;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;transition:opacity .15s}
.warn-x:hover{opacity:1}

@media (prefers-reduced-motion:reduce) {
  *{transition:none!important;animation:none!important}
}
@media (max-width:640px) {
  /* Header: stack title over stats so nothing clips off-screen */
  .hdr{flex-direction:column;align-items:stretch;gap:10px;padding:10px 14px}
  .hdr-right{gap:10px;justify-content:space-between;flex-wrap:wrap}
  .stats{gap:14px;flex:1 1 auto}
  .stat-val{font-size:16px}
  .stat-sep{height:20px}
  .btn-csv{font-size:10px;padding:5px 9px}
  .btn-reset{font-size:10px;padding:5px 9px}

  /* Warning: flush to edges on mobile */
  .warn{border-radius:0;border-left:none;border-right:none;font-size:11.5px}

  /* Controls: search drops to full-width second line */
  .ctrl{padding:8px 14px}
  .csep{display:none}
  .sort-btn{margin-left:0}
  .search{width:100%;margin-left:0;flex-basis:100%;order:10}

  /* Template panel */
  .ttoggle{padding:10px 14px}
  .tbody2{padding:0 14px 12px}
  .ttabs{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* Table: flush container, hide columns that duplicate info */
  .twrap{padding:0 0 48px}
  .gh td{padding:10px 14px 4px}
  .er td{padding:9px 14px}
  .ce{display:none}     /* email hidden — still in copy btn data-email */
  .cbadge{display:none} /* category — already shown in group header */
  .cst{display:none}    /* status — secondary, hidden on mobile */
  .ctrl-oc{padding:5px 14px}
  .sig-row{gap:4px}
  .note-ta{max-width:100%}

  /* Larger touch targets */
  .eck{width:18px;height:18px}
  .btn-cr{padding:8px 12px;font-size:10px}
  .ccp{width:56px}
  .fbtn{padding:6px 11px}
}

/* Outcomes */
.odot{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;margin:4px auto 0;flex-shrink:0;transition:transform .1s}
.odot:hover{transform:scale(1.3)}
.odot-sm{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* Outcome filter bar */
.ctrl-oc{display:flex;align-items:center;gap:4px;padding:5px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.oc-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap;padding-right:4px}
.obtn{font-family:'DM Sans',sans-serif;font-size:11px;background:transparent;border:1px solid transparent;color:var(--muted);padding:3px 9px;border-radius:4px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;white-space:nowrap}
.obtn:hover{color:var(--text);border-color:var(--border)}
.obtn.oa{border-color:var(--border-hover);color:var(--text);background:rgba(255,255,255,.05)}
/* Notes */
.note-icon{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0 3px;line-height:1;opacity:.45;transition:opacity .15s;vertical-align:middle}
.note-icon:hover{opacity:1}
.note-has{opacity:.9;color:var(--accent)}
.note-preview{font-size:10px;color:var(--muted);margin-top:2px;font-style:italic;line-height:1.4;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-edit{margin-top:5px}
.note-ta{width:100%;max-width:380px;min-height:50px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;border-radius:3px;padding:5px 8px;resize:vertical;line-height:1.5}
.note-ta:focus{outline:none;border-color:var(--border-hover)}
/* Settings panel */
.sig-row{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 8px}
.sig-inp{font-family:'DM Mono',monospace;font-size:11px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:4px;flex:1;min-width:140px;transition:border-color .15s}
.sig-inp:focus{outline:none;border-color:var(--border-hover)}
.sig-inp::placeholder{color:var(--muted)}
.sig-hint{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);padding-bottom:4px}
/* Bulk mark */
.btn-markall{font-family:'DM Mono',monospace;font-size:9px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:3px;cursor:pointer;margin-left:10px;transition:all .15s;text-transform:none;letter-spacing:0;font-weight:400;vertical-align:middle}
.btn-markall:hover{border-color:var(--accent-dim);color:var(--accent)}
/* Mailto + note buttons in ccp */
.btn-mailto{border-color:rgba(110,168,232,.25);color:rgba(110,168,232,.6)}
.btn-mailto:hover{border-color:#6ea8e8;color:#6ea8e8}
.btn-note{border-color:transparent;color:var(--muted)}
.btn-note:hover{border-color:var(--border);color:var(--text)}
/* CSV button */
.btn-csv{font-family:'DM Mono',monospace;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:4px;cursor:pointer;transition:all .15s}
.btn-csv:hover{border-color:var(--border-hover);color:var(--text)}
</style>
</head>
<body>

<header class="hdr">
  <div>
    <div class="hdr-title">Outreach CRM</div>
    <div class="hdr-sub">EN↔PT Translation Services</div>
  </div>
  <div class="hdr-right">
    <div class="stats">
      <div class="stat"><div class="stat-val" id="sv-total">—</div><div class="stat-lbl">Total</div></div>
      <div class="stat-sep"></div>
      <div class="stat"><div class="stat-val" id="sv-sent">—</div><div class="stat-lbl">Sent</div></div>
      <div class="stat-sep"></div>
      <div class="stat"><div class="stat-val" id="sv-rem">—</div><div class="stat-lbl">Remaining</div></div>
      <div class="stat-sep"></div>
      <div class="stat"><div class="stat-val" id="sv-today">0</div><div class="stat-lbl">Today</div></div>
    </div>
    <button type="button" class="btn-theme" id="btn-theme" onclick="toggleTheme()" title="Toggle light / dark mode" aria-label="Toggle light or dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <button type="button" class="btn-csv" onclick="exportCSV()" title="Export all contacts to CSV">CSV ↓</button>
    <button type="button" class="btn-reset" onclick="resetAll()">Reset All</button>
  </div>
</header>

<div class="ctrl">
  <button class="fbtn" data-f="all" onclick="setFilter('all')">All</button>
  <button class="fbtn" data-f="unsent" onclick="setFilter('unsent')">Unsent only</button>
  <div class="csep"></div>
  <button type="button" class="fbtn" data-f="câmara" onclick="setFilter('câmara')">Câmaras</button>
  <button type="button" class="fbtn" data-f="motel" onclick="setFilter('motel')">Motéis</button>
  <button type="button" class="fbtn" data-f="company" onclick="setFilter('company')">Companies</button>
  <button type="button" class="fbtn" data-f="cultural" onclick="setFilter('cultural')">Cultural</button>
  <button type="button" class="fbtn" data-f="hotel" onclick="setFilter('hotel')">Hotels</button>
  <button type="button" class="fbtn" data-f="junta" onclick="setFilter('junta')">Juntas</button>
  <button type="button" class="fbtn" data-f="flagged" onclick="setFilter('flagged')">⚠ Flagged</button>
  <button type="button" class="sort-btn" id="sort-btn" onclick="toggleSort()" title="Sort by response likelihood">Sort: by category</button>
  <input type="search" class="search" id="search" placeholder="Search…" oninput="setSearch(this.value)">
</div>

<div class="ctrl-oc">
  <span class="oc-lbl">Outcome:</span>
  <button type="button" class="obtn oa" data-o="" onclick="setOutcomeFilter('')">all</button>
  <button type="button" class="obtn" data-o="replied" onclick="setOutcomeFilter('replied')"><span class="odot-sm" style="background:#6ea8e8"></span>replied</button>
  <button type="button" class="obtn" data-o="interested" onclick="setOutcomeFilter('interested')"><span class="odot-sm" style="background:#4ec97a"></span>interested</button>
  <button type="button" class="obtn" data-o="declined" onclick="setOutcomeFilter('declined')"><span class="odot-sm" style="background:#e06f6f"></span>declined</button>
  <button type="button" class="obtn" data-o="bounced" onclick="setOutcomeFilter('bounced')"><span class="odot-sm" style="background:#e8a23a"></span>bounced</button>
  <button type="button" class="obtn" data-o="followup" onclick="setOutcomeFilter('followup')"><span class="odot-sm" style="background:#a07ede"></span>follow up</button>
</div>

<div class="tpanel">
  <button class="ttoggle open" id="ttoggle" onclick="toggleTpl()">
    Email Templates
    <svg class="tchev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>
  <div class="tbody2 open" id="tbody2">
    <div class="ttabs" id="ttabs"></div>
    <div class="tcontent" id="tcontent"></div>
  </div>
</div>

<div class="tpanel">
  <button type="button" class="ttoggle" id="sigtoggle" onclick="toggleSig()">
    Settings — Signature &amp; Templates
    <svg class="tchev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>
  <div class="tbody2" id="sigbody">
    <div class="sig-row">
      <input type="text"  class="sig-inp" id="sig-name"  placeholder="Your name"              oninput="saveSig()">
      <input type="email" class="sig-inp" id="sig-email" placeholder="your@email.com"          oninput="saveSig()">
      <input type="url"   class="sig-inp" id="sig-url"   placeholder="Portfolio URL (optional)" oninput="saveSig()">
    </div>
    <div class="sig-hint">Auto-fills [your name], [your@email.com] and [your portfolio URL] when copying or opening a template. Stored locally in your browser.</div>
  </div>
</div>

<div class="twrap">
  <table><tbody id="tb"></tbody></table>
  <div id="nores" style="display:none">No entries match your filters.</div>
</div>

<script>
const CAT_ORDER = ['câmara','motel','company','cultural','hotel','junta'];
const CAT_COLOR = {'câmara':'#3b82f6','motel':'#f59e0b','company':'#8b5cf6','cultural':'#ec4899','hotel':'#06b6d4','junta':'#10b981'};
const CAT_LABEL = {'câmara':'Câmara','motel':'Motel','company':'Company','cultural':'Cultural','hotel':'Hotel','junta':'Junta'};
const CAT_NAME  = {'câmara':'Câmaras Municipais','motel':'Motéis','company':'Companies','cultural':'Cultural Institutions','hotel':'Hotels','junta':'Juntas de Freguesia'};
const CAT_ACT   = {'câmara':'act-c','motel':'act-m','company':'act-co','cultural':'act-cu','hotel':'act-h','junta':'act-j'};

const TEMPLATES = [
  {
    label:'Câmara Municipal',

// ─── State ───
const LS_KEY = 'gm_outreach_sent_v1';
const DEFAULT_SENT = ['m1','m2','m3'];
let sentSet = new Set();
let activeFilter = 'all';
let searchQuery = '';
let activeTpl = 0;
let sortMode = 'cat'; // 'cat' | 'priority'
let activeOutcome = '';   // '' | 'replied' | 'interested' | 'declined' | 'bounced' | 'followup'
let outcomesMap = {};     // {id: outcome}
let notesMap    = {};     // {id: note text}
let sigSettings = {name:'', email:'', url:''};

const OUTCOME_CFG = {
  '':          {label:'',           color:''},
  replied:     {label:'replied',    color:'#6ea8e8'},
  interested:  {label:'interested', color:'#4ec97a'},
  declined:    {label:'declined',   color:'#e06f6f'},
  bounced:     {label:'bounced',    color:'#e8a23a'},
  followup:    {label:'follow up',  color:'#a07ede'},
};
const OUTCOME_CYCLE = ['','replied','interested','declined','bounced','followup'];
const CAT_TPL_IDX   = {câmara:0, motel:1, company:2, cultural:3, hotel:4, junta:5};

// ─── localStorage ───
function loadSent() {
  const v = localStorage.getItem(LS_KEY);
  sentSet = v !== null ? new Set(JSON.parse(v)) : new Set(DEFAULT_SENT);
  if (v === null) saveSent();
}
function saveSent() {
  localStorage.setItem(LS_KEY, JSON.stringify([...sentSet]));
}
function loadOutcomes() {
  try { outcomesMap = JSON.parse(localStorage.getItem('crm_outcomes') || '{}'); } catch(e) { outcomesMap = {}; }
}
function saveOutcomes() {
  try { localStorage.setItem('crm_outcomes', JSON.stringify(outcomesMap)); } catch(e) {}
}
function loadNotes() {
  try { notesMap = JSON.parse(localStorage.getItem('crm_notes') || '{}'); } catch(e) { notesMap = {}; }
}
function saveNotes() {
  try { localStorage.setItem('crm_notes', JSON.stringify(notesMap)); } catch(e) {}
}
function loadSigSettings() {
  try { sigSettings = Object.assign({name:'',email:'',url:''}, JSON.parse(localStorage.getItem('crm_sig') || '{}')); } catch(e) {}
}
function saveSig() {
  sigSettings = {
    name:  (document.getElementById('sig-name') .value || '').trim(),
    email: (document.getElementById('sig-email').value || '').trim(),
    url:   (document.getElementById('sig-url')  .value || '').trim(),
  };
  try { localStorage.setItem('crm_sig', JSON.stringify(sigSettings)); } catch(e) {}
}
function initSigPanel() {
  document.getElementById('sig-name') .value = sigSettings.name;
  document.getElementById('sig-email').value = sigSettings.email;
  document.getElementById('sig-url')  .value = sigSettings.url;
}
function toggleSig() {
  document.getElementById('sigtoggle').classList.toggle('open');
  document.getElementById('sigbody').classList.toggle('open');
}
// Daily counter
function getDailyCount() {
  try {
    const today = new Date().toISOString().slice(0,10);
    const d = JSON.parse(localStorage.getItem('crm_daily') || '{}');
    return d.date === today ? (d.count || 0) : 0;
  } catch(e) { return 0; }
}
function incrementDaily() {
  try {
    const today = new Date().toISOString().slice(0,10);
    const d = JSON.parse(localStorage.getItem('crm_daily') || '{}');
    const count = (d.date === today ? (d.count||0) : 0) + 1;
    localStorage.setItem('crm_daily', JSON.stringify({date:today, count}));
    const el = document.getElementById('sv-today');
    if (el) el.textContent = count;
  } catch(e) {}
}
function initDailyStat() {
  const el = document.getElementById('sv-today');
  if (el) el.textContent = getDailyCount();
}

// ─── Actions ───
function toggleSent(id) {
  const wasSent = sentSet.has(id);
  wasSent ? sentSet.delete(id) : sentSet.add(id);
  if (!wasSent) incrementDaily();
  saveSent();
  render();
}
function resetAll() {
  if (!confirm('Mark all entries as unsent? This will clear all sent state.')) return;
  sentSet.clear();
  saveSent();
  render();
}
// ─── Outcomes ───
function cycleOutcome(id) {
  const cur = outcomesMap[id] || '';
  const next = OUTCOME_CYCLE[(OUTCOME_CYCLE.indexOf(cur) + 1) % OUTCOME_CYCLE.length];
  if (next === '') delete outcomesMap[id]; else outcomesMap[id] = next;
  saveOutcomes();
  render();
}
function setOutcomeFilter(o) {
  activeOutcome = o;
  updateOutcomeBtns();
  renderTable();
}
function updateOutcomeBtns() {
  document.querySelectorAll('.obtn').forEach(b => b.classList.toggle('oa', b.dataset.o === activeOutcome));
}
// ─── Notes ───
function toggleNote(id) {
  const el = document.getElementById('ne-'+id);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (!open) el.querySelector('.note-ta').focus();
}
function saveNote(id, value) {
  const v = value.trim();
  if (v) notesMap[id] = v; else delete notesMap[id];
  saveNotes();
  const pr = document.getElementById('np-'+id);
  if (pr) { pr.textContent = v; pr.style.display = v ? '' : 'none'; }
  const ni = document.getElementById('ni-'+id);
  if (ni) ni.classList.toggle('note-has', !!v);
}
// ─── Mailto + template fill ───
function getFirstName(sub) {
  if (!sub || !sub.includes('·')) return null;
  const part = sub.split('—')[0].trim();
  const first = part.split(' ')[0];
  return first.length > 1 ? first : null;
}
function fillTemplate(body, firstName, company) {
  let t = body;
  if (firstName) t = t.replace(/\[Name\]/g, firstName);
  if (company)   t = t.replace(/\[Company\]/g, company);
  const sig = sigSettings;
  const sigLine = [sig.name, sig.email].filter(Boolean).join(' · ') || '[your name · your@email.com]';
  t = t.replace(/\[your name · your@email\.com\]/g, sigLine);
  t = t.replace(/\[your name\]/gi,        sig.name  || '[your name]');
  t = t.replace(/\[your@email\.com\]/gi, sig.email || '[your@email.com]');
  t = t.replace(/\[your portfolio URL\]/gi, sig.url || '[your portfolio URL]');
  return t;
}
function openMailtoEl(btn) {
  const e = entries.find(x => x.id === btn.dataset.id);
  if (!e) return;
  const tpl = TEMPLATES[CAT_TPL_IDX[e.cat] || 0];
  const body = fillTemplate(tpl.body, getFirstName(e.sub), e.name);
  const subj = tpl.subject.replace(/\[Company\]/g, e.name);
  window.location.href = 'mailto:' + encodeURIComponent(e.email)
    + '?subject=' + encodeURIComponent(subj)
    + '&body='    + encodeURIComponent(body);
}
// ─── CSV export ───
function exportCSV() {
  const rows = [['ID','Category','Name','Contact','Email','Status','Sent','Outcome','Note','Press Inbox']];
  entries.forEach(e => rows.push([
    e.id, e.cat, e.name, e.sub, e.email, e.status,
    sentSet.has(e.id)?'yes':'no',
    outcomesMap[e.id]||'',
    (notesMap[e.id]||'').replace(/\n/g,' '),
    e.press||''
  ]));
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'crm-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
// ─── Bulk mark ───
function markGroupSent(idsStr) {
  idsStr.split(',').forEach(id => { if (!sentSet.has(id)) { sentSet.add(id); incrementDaily(); } });
  saveSent(); render();
}
function setFilter(f) {
  activeFilter = f;
  render();
}
function setSearch(v) {
  searchQuery = v.toLowerCase();
  render();
}
function toggleTpl() {
  document.getElementById('ttoggle').classList.toggle('open');
  document.getElementById('tbody2').classList.toggle('open');
}
function setTplTab(i) {
  activeTpl = i;
  renderTpl();
}

// ─── Utils ───
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function copyText(text, btn, label) {
  navigator.clipboard.writeText(text).then(() => {
    const o = btn.textContent;
    btn.textContent = label;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const o = btn.textContent;
    btn.textContent = label;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── Render ───
function render() {
  renderStats();
  updateFilterBtns();
  renderTable();
}

function renderStats() {
  document.getElementById('sv-total').textContent = entries.length;
  document.getElementById('sv-sent').textContent = sentSet.size;
  document.getElementById('sv-rem').textContent = entries.length - sentSet.size;
}

function updateFilterBtns() {
  const actMap = {
    'all':'act-a','unsent':'act-a','flagged':'act-a',
    'câmara':'act-c','motel':'act-m','company':'act-co',
    'cultural':'act-cu','hotel':'act-h','junta':'act-j'
  };
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.className = 'fbtn';
    if (btn.dataset.f === activeFilter) btn.classList.add(actMap[activeFilter]||'act-a');
  });
  updateOutcomeBtns();
}

function filteredEntries() {
  const q = searchQuery;
  return entries.filter(e => {
    if (activeFilter === 'unsent'  && sentSet.has(e.id)) return false;
    if (activeFilter === 'flagged' && !e.sub.includes('⚠')) return false;
    if (activeFilter !== 'all' && activeFilter !== 'unsent' && activeFilter !== 'flagged' && e.cat !== activeFilter) return false;
    if (activeOutcome && (outcomesMap[e.id]||'') !== activeOutcome) return false;
    if (q) {
      const hay = (e.name+' '+e.sub+' '+e.email+(notesMap[e.id]||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  const filtered = filteredEntries();
  const tb = document.getElementById('tb');
  const nores = document.getElementById('nores');
  if (!filtered.length) { tb.innerHTML = ''; nores.style.display = ''; return; }
  nores.style.display = 'none';

  function rowHtml(e) {
    const sent = sentSet.has(e.id);
    const outcome = outcomesMap[e.id] || '';
    const ocfg = OUTCOME_CFG[outcome] || OUTCOME_CFG[''];
    const note  = notesMap[e.id] || '';
    const c2 = CAT_COLOR[e.cat];
    const odStyle = outcome ? `background:${ocfg.color};border-color:${ocfg.color}` : '';
    return `<tr class="er${sent?' sent':''}">
      <td class="cc">
        <input type="checkbox" class="eck"${sent?' checked':''} data-id="${esc(e.id)}" onchange="toggleSent(this.dataset.id)">
        <button type="button" class="odot" onclick="cycleOutcome('${esc(e.id)}')" style="${odStyle}" title="${ocfg.label||'Set outcome (click to cycle)'}"></button>
      </td>
      <td>
        <div class="en">${esc(e.name)} <button type="button" class="note-icon${note?' note-has':''}" id="ni-${esc(e.id)}" onclick="toggleNote('${esc(e.id)}')" title="${note?'Edit note':'Add note'}">✎</button></div>
        <div class="es">${esc(e.sub)}</div>
        <div class="note-preview" id="np-${esc(e.id)}" style="${note?'':'display:none'}">${esc(note)}</div>
        <div class="note-edit" id="ne-${esc(e.id)}" style="display:none"><textarea class="note-ta" onblur="saveNote('${esc(e.id)}',this.value)" placeholder="Add a note…">${esc(note)}</textarea></div>
      </td>
      <td class="ce"><span class="ee">${esc(e.email)}</span>${e.press?`<div class="ep">↳ ${esc(e.press)}</div>`:''}</td>
      <td class="cbadge"><span class="badge" style="background:${c2}22;color:${c2};border:1px solid ${c2}44">${CAT_LABEL[e.cat]}</span></td>
      <td class="cst"><span class="badge s-${e.status}">${e.status}</span></td>
      <td class="ccp">
        <button type="button" class="btn-cr" data-email="${esc(e.email)}" onclick="copyEmail(this)">copy</button>
        ${e.press?`<button type="button" class="btn-cr btn-press" data-email="${esc(e.press)}" onclick="copyEmail(this)" title="Copy press inbox">press</button>`:''}
        <button type="button" class="btn-cr btn-mailto" data-id="${esc(e.id)}" onclick="openMailtoEl(this)" title="Open in email client with template pre-filled">✉ open</button>
      </td>
    </tr>`;
  }

  let html = '';
  if (sortMode === 'priority') {
    // Flat list sorted by priority score desc, then name
    const sorted = [...filtered].sort((a,b) => priScore(b)-priScore(a) || a.name.localeCompare(b.name));
    sorted.forEach(e => { html += rowHtml(e); });
  } else {
    // Grouped by category; within each group: named contacts first, then alpha
    const groups = {};
    CAT_ORDER.forEach(c => groups[c] = []);
    filtered.forEach(e => { if (groups[e.cat]) groups[e.cat].push(e); });
    let firstGroup = true;
    CAT_ORDER.forEach(cat => {
      const grp = groups[cat].sort((a,b) => {
        const an = a.sub && a.sub.includes('·') ? 0 : 1;
        const bn = b.sub && b.sub.includes('·') ? 0 : 1;
        return an - bn || a.name.localeCompare(b.name);
      });
      if (!grp.length) return;
      const col = CAT_COLOR[cat];
      const unsent = grp.filter(e => !sentSet.has(e.id)).length;
      const unsentIds = grp.filter(e=>!sentSet.has(e.id)).map(e=>e.id).join(',');
      html += `<tr class="gh${firstGroup?' first':''}">
        <td colspan="6" style="color:${col}">${esc(CAT_NAME[cat])}<span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0"> — ${unsent} unsent / ${grp.length} total</span>${unsent>0?`<button type="button" class="btn-markall" onclick="markGroupSent('${unsentIds}')">mark all sent</button>`:''}</td>
      </tr>`;
      firstGroup = false;
      grp.forEach(e => { html += rowHtml(e); });
    });
  }
  tb.innerHTML = html;
}

function copyEmail(btn) {
  copyText(btn.dataset.email, btn, 'copied!');
}

function renderTpl() {
  let tabs = '';
  TEMPLATES.forEach((t, i) => {
    tabs += `<button class="ttab${i===activeTpl?' on':''}" onclick="setTplTab(${i})">${esc(t.label)}</button>`;
  });
  document.getElementById('ttabs').innerHTML = tabs;
  const t = TEMPLATES[activeTpl];
  document.getElementById('tcontent').innerHTML = `
    <div class="theater">
      <div class="tsubj">Subject: ${esc(t.subject)}</div>
      <button class="btn-ctpl" onclick="copyTpl(this)">Copy</button>
    </div>
    <div class="ttext">${esc(t.body)}</div>`;
}

function copyTpl(btn) {
  const t = TEMPLATES[activeTpl];
  copyText('Subject: ' + t.subject + '\n\n' + fillTemplate(t.body, null), btn, 'Copied!');
}

// ─── Init ───
loadSent();
loadOutcomes();
loadNotes();
function toggleTheme() {
  var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('gm_theme', next); } catch(e) {}
}
loadSigSettings();
initDailyStat();
renderTpl();
render();
initSigPanel();
// On small screens, start with the (tall) template panel collapsed to reduce clutter
try {
  if (window.matchMedia('(max-width:640px)').matches) {
    document.getElementById('ttoggle').classList.remove('open');
    document.getElementById('tbody2').classList.remove('open');
  }
} catch(e) {}
</script>
