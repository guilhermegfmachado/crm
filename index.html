<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d11;
  --surface: #13161e;
  --border: #1e2333;
  --border-hover: #2d3348;
  --text: #e2e6f0;
  --muted: #5d6680;
  --accent: #d4a853;
  --accent-dim: #b89040;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5}

/* Header */
.hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.hdr-title{font-size:18px;font-weight:600;color:var(--accent);letter-spacing:-0.02em}
.hdr-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:3px}
.hdr-right{display:flex;align-items:center;gap:20px}
.stats{display:flex;align-items:center;gap:16px}
.stat{text-align:center}
.stat-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);line-height:1}
.stat-lbl{font-family:'DM Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:3px}
.stat-sep{width:1px;height:28px;background:var(--border)}
.btn-reset{font-family:'DM Mono',monospace;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:4px;cursor:pointer;transition:border-color .15s,color .15s}
.btn-reset:hover{border-color:var(--border-hover);color:var(--text)}

/* Controls */
.ctrl{display:flex;align-items:center;gap:6px;padding:10px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fbtn{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 11px;border-radius:4px;cursor:pointer;transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:var(--border-hover);color:var(--text)}
.fbtn.act-a{color:var(--accent);border-color:var(--accent);background:rgba(212,168,83,.07)}
.fbtn.act-c{color:#6ea8e8;border-color:#6ea8e8;background:rgba(110,168,232,.07)}
.fbtn.act-m{color:#e8a23a;border-color:#e8a23a;background:rgba(232,162,58,.07)}
.fbtn.act-co{color:#a07ede;border-color:#a07ede;background:rgba(160,126,222,.07)}
.fbtn.act-cu{color:#e06faa;border-color:#e06faa;background:rgba(224,111,170,.07)}
.fbtn.act-h{color:#3cc8e0;border-color:#3cc8e0;background:rgba(60,200,224,.07)}
.fbtn.act-j{color:#4ec97a;border-color:#4ec97a;background:rgba(78,201,122,.07)}
.csep{width:1px;height:20px;background:var(--border);flex-shrink:0}
.search{font-family:'DM Mono',monospace;font-size:12px;background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:4px;width:200px;margin-left:auto;transition:border-color .15s}
.search:focus{outline:none;border-color:var(--border-hover)}
.search::placeholder{color:var(--muted)}

/* Template panel */
.tpanel{border-bottom:1px solid var(--border);background:var(--surface)}
.ttoggle{display:flex;align-items:center;gap:8px;width:100%;padding:10px 24px;background:transparent;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;transition:color .15s;text-align:left}
.ttoggle:hover{color:var(--text)}
.tchev{margin-left:auto;transition:transform .2s}
.ttoggle.open .tchev{transform:rotate(180deg)}
.tbody2{display:none;padding:0 24px 16px}
.tbody2.open{display:block}
.ttabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
.ttab{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;background:transparent;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);padding:7px 14px;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap}
.ttab:hover{color:var(--text)}
.ttab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tcontent{}
.theater{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.tsubj{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.btn-ctpl{font-family:'DM Mono',monospace;font-size:10px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:3px;cursor:pointer;transition:all .15s;flex-shrink:0;margin-left:12px}
.btn-ctpl:hover{border-color:var(--accent-dim);color:var(--accent)}
.btn-ctpl.copied{border-color:var(--accent);color:var(--accent)}
.ttext{font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--text);white-space:pre-wrap;line-height:1.65;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:12px 14px;max-height:180px;overflow-y:auto}

/* Table */
.twrap{padding:0 24px 48px}
table{width:100%;border-collapse:collapse}
.gh td{padding:14px 8px 5px;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;border-top:1px solid var(--border)}
.gh.first td{border-top:none;padding-top:10px}
.er{transition:background .1s}
.er:hover{background:var(--surface)}
.er td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.er.sent{opacity:.45}
.cc{width:32px;text-align:center}
.eck{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.en{font-size:13px;font-weight:500;color:var(--text)}
.er.sent .en{text-decoration:line-through}
.es{font-size:11px;color:var(--muted);margin-top:1px}
.ce{width:260px}
.ee{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.cbadge{width:80px}
.cst{width:80px}
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.s-confirmed{background:rgba(212,168,83,.1);color:var(--accent-dim);border:1px solid rgba(212,168,83,.2)}
.s-pattern{background:rgba(102,102,102,.1);color:var(--muted);border:1px solid rgba(102,102,102,.2)}
.ccp{width:60px;text-align:right}
.btn-cr{font-family:'DM Mono',monospace;font-size:9px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:3px;cursor:pointer;transition:all .15s}
.btn-cr:hover{border-color:var(--border-hover);color:var(--text)}
.btn-cr.copied{color:var(--accent);border-color:var(--accent)}
#nores{text-align:center;padding:48px;font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
</style>
</head>

</div>

</div>

<div class="twrap">
  <table><tbody id="tb"></tbody></table>

</div>

// ─── State ───
const LS_KEY = 'gm_outreach_sent_v1';
const DEFAULT_SENT = ['m1','m2','m3'];
let sentSet = new Set();
let activeFilter = 'all';
let searchQuery = '';
let activeTpl = 0;

// ─── localStorage ───
function loadSent() {
  try {
    const v = localStorage.getItem(LS_KEY);
    sentSet = v !== null ? new Set(JSON.parse(v)) : new Set(DEFAULT_SENT);
    if (v === null) saveSent();
  } catch(e) {
    sentSet = new Set(DEFAULT_SENT);
  }
}
function saveSent() {
  try { localStorage.setItem(LS_KEY, JSON.stringify([...sentSet])); } catch(e) {}
}

// ─── Actions ───
function toggleSent(id) {
  sentSet.has(id) ? sentSet.delete(id) : sentSet.add(id);
  saveSent();
  render();
}
function resetAll() {
  if (!confirm('Mark all entries as unsent? This will clear all sent state.')) return;
  sentSet.clear();
  saveSent();
  render();
}
function setFilter(f) {
  activeFilter = f;
  render();
}
function setSearch(v) {
  searchQuery = v.toLowerCase().trim();
  render();
}
function toggleTpl() {
  document.getElementById('ttoggle').classList.toggle('open');
  document.getElementById('tbody2').classList.toggle('open');
}
function setTplTab(i) {
  activeTpl = i;
  renderTpl();
}

// ─── Utils ───
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function copyText(text, btn, label) {
  navigator.clipboard.writeText(text).then(() => {
    const o = btn.textContent;
    btn.textContent = label;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const o = btn.textContent;
    btn.textContent = label;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = o; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── Render ───
function render() {
  renderStats();
  updateFilterBtns();
  renderTable();
}

function renderStats() {
  const total = entries.length;
  const sent = entries.filter(e => sentSet.has(e.id)).length;
  document.getElementById('sv-total').textContent = total;
  document.getElementById('sv-sent').textContent = sent;
  document.getElementById('sv-rem').textContent = total - sent;
}

function updateFilterBtns() {
  const actMap = {
    'all':'act-a','unsent':'act-a',
    'câmara':'act-c','motel':'act-m','company':'act-co',
    'cultural':'act-cu','hotel':'act-h','junta':'act-j'
  };
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.className = 'fbtn';
    if (btn.dataset.f === activeFilter) btn.classList.add(actMap[activeFilter]);
  });
}

function filteredEntries() {
  const q = searchQuery;
  return entries.filter(e => {
    if (activeFilter === 'unsent' && sentSet.has(e.id)) return false;
    if (activeFilter !== 'all' && activeFilter !== 'unsent' && e.cat !== activeFilter) return false;
    if (q) {
      const hay = (e.name + ' ' + e.sub + ' ' + e.email).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  const filtered = filteredEntries();
  const tb = document.getElementById('tb');
  const nores = document.getElementById('nores');
  if (!filtered.length) { tb.innerHTML = ''; nores.style.display = ''; return; }
  nores.style.display = 'none';

  const groups = {};
  CAT_ORDER.forEach(c => groups[c] = []);
  filtered.forEach(e => { if (groups[e.cat]) groups[e.cat].push(e); });

  let html = '';
  let firstGroup = true;
  CAT_ORDER.forEach(cat => {
    const grp = groups[cat];
    if (!grp.length) return;
    const col = CAT_COLOR[cat];
    const unsent = grp.filter(e => !sentSet.has(e.id)).length;
    html += `<tr class="gh${firstGroup?' first':''}">
      <td colspan="6" style="color:${col}">${esc(CAT_NAME[cat])}<span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0"> — ${unsent} unsent / ${grp.length} total</span></td>
    </tr>`;
    firstGroup = false;
    grp.forEach(e => {
      const sent = sentSet.has(e.id);
      const c2 = CAT_COLOR[e.cat];
      html += `<tr class="er${sent?' sent':''}">
        <td class="cc"><input type="checkbox" class="eck"${sent?' checked':''} onchange="toggleSent('${e.id}')"></td>
        <td><div class="en">${esc(e.name)}</div><div class="es">${esc(e.sub)}</div></td>
        <td class="ce"><span class="ee">${esc(e.email)}</span></td>
        <td class="cbadge"><span class="badge" style="background:${c2}22;color:${c2};border:1px solid ${c2}44">${CAT_LABEL[e.cat]}</span></td>
        <td class="cst"><span class="badge s-${e.status}">${e.status}</span></td>
        <td class="ccp"><button class="btn-cr" data-email="${esc(e.email)}" onclick="copyEmail(this)">copy</button></td>
      </tr>`;
    });
  });
  tb.innerHTML = html;
}

function copyEmail(btn) {
  copyText(btn.dataset.email, btn, 'copied!');
}

function renderTpl() {
  let tabs = '';
  TEMPLATES.forEach((t, i) => {
    tabs += `<button class="ttab${i===activeTpl?' on':''}" onclick="setTplTab(${i})">${esc(t.label)}</button>`;
  });
  document.getElementById('ttabs').innerHTML = tabs;
  const t = TEMPLATES[activeTpl];
  document.getElementById('tcontent').innerHTML = `
    <div class="theater">
      <div class="tsubj">Subject: ${esc(t.subject)}</div>
      <button class="btn-ctpl" onclick="copyTpl(this)">Copy</button>
    </div>
    <div class="ttext">${esc(t.body)}</div>`;
}

function copyTpl(btn) {
  const t = TEMPLATES[activeTpl];
  copyText('Subject: ' + t.subject + '\n\n' + t.body, btn, 'Copied!');
}

// ─── Init ───
loadSent();
renderTpl();
render();
</script>
